name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_ANON_KEY: "mock-anon-key"
      PUBLIC_SITE_URL: "https://portfolio-builder.pages.dev"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Diagnostic & Typecheck (Astro Check)
        run: npx astro check

      - name: Production build (Astro Cloudflare)
        run: npm run build

