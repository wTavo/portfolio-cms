# ==============================================================================
# Docker Compose — Orquestación de Desarrollo Local
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: portfolio_builder_dev
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    env_file:
      - path: .env
        required: false
    volumes:
      # Montaje del código fuente para hot-reloading en tiempo real
      - .:/app
      # Proteger la carpeta node_modules del contenedor para evitar colisiones con el host
      - /app/node_modules
    init: true
    # Mantener el proceso interactivo de la terminal de Astro abierto
    tty: true
    stdin_open: true
    command: sh -c "rm -f .astro/dev.json .astro/dev.pid 2>/dev/null || true; npx astro dev --host 0.0.0.0 --force"
    restart: unless-stopped
